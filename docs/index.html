<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>LUCI ROS2 SDK Documentation has moved</title>
    <!-- GitHub Pages serves this file for every path under the old site, including as 404.html,
         so the redirect keeps the rest of the path. -->
    <script>
        var NEW_SITE = 'https://sdk.luci.com/ros2/docs/';
        var path = window.location.pathname.replace(/^\/luci-sdk-docs\/?/, '');
        window.location.replace(NEW_SITE + path + window.location.search + window.location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://sdk.luci.com/ros2/docs/">
    <link rel="canonical" href="https://sdk.luci.com/ros2/docs/">
</head>
<body>
    <p>The LUCI ROS2 SDK documentation has moved to
        <a href="https://sdk.luci.com/ros2/docs/">https://sdk.luci.com/ros2/docs/</a>.</p>
</body>
</html>
